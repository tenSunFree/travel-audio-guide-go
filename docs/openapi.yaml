openapi: "3.0.3"

info:
  title: Travel Audio Guide API
  version: "1.0.0"
  description: |
    ## Instructions
    This is the backend API for the travel audio guide.

    ## Verification Method
    All `/api/v1/*` requests require a Supabase JWT token.

    **Steps:**
    1. Click the **Authorize** button in the upper right corner.
    2. Enter the Supabase `access_token` in the `bearerAuth (http, Bearer)` field.
    3. Click **Authorize** → **Close**.
    4. Subsequent requests will automatically include `Authorization: Bearer <token>`.

    ## Security Design
    - The frontend **does not pass user_id**; the backend automatically obtains it from the JWT `claims.sub`.
    - All user-scoped SQL queries use the user_id parsed from the JWT as a condition.
    - `/open-api/*` routes are public tourism data and intentionally do not require authentication.

servers:
  - url: http://localhost:8080
    description: Local development environment

tags:
  - name: System
    description: System status
  - name: Me
    description: Current user profile operations
  - name: Attractions
    description: Taipei Travel attractions compatibility proxy
  - name: Events
    description: Taipei Travel events compatibility proxy
  - name: Media
    description: Taipei Travel media (audio guide) compatibility proxy
  - name: Tours
    description: Taipei Travel themed tour compatibility proxy
  - name: Miscellaneous
    description: Taipei Travel miscellaneous compatibility proxy (e.g. category lookups)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token obtained after logging into Supabase.
        When entering it, **you do not need to** add the `Bearer` prefix; Swagger UI will add it automatically.

  schemas:
    # Profile (Return Format)
    Profile:
      type: object
      description: User profile information
      properties:
        id:
          type: string
          format: uuid
          description: "The Supabase user_id comes from JWT claims.sub and is filled in by the backend."
          example: "0e9b1a0e-1234-5678-abcd-xxxxxxxxxxxx"
        email:
          type: string
          format: email
          nullable: true
          description: "login email"
          example: "user@example.com"
        display_name:
          type: string
          nullable: true
          description: "Display name, 1–50 characters"
          example: "Sun"
        avatar_url:
          type: string
          format: uri
          nullable: true
          description: "Profile picture URL"
          example: "https://example.com/avatar.png"
        preferred_language:
          type: string
          description: "Preferred language"
          enum: [zh-TW, zh-CN, en, ja]
          example: "zh-TW"
        created_at:
          type: string
          format: date-time
          example: "2026-06-14T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-06-14T00:10:00Z"

    # UpdateMeRequest (Body for PUT /me)
    UpdateMeRequest:
      type: object
      description: |
        Request body for updating the profile.
        **All fields are optional**; only send the fields you want to update, and omitted fields keep their original values.
        **Do not send user_id**; the backend retrieves it automatically from the JWT.
      properties:
        display_name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 50
          description: "Display name, 1-50 characters"
          example: "Sun"
        avatar_url:
          type: string
          format: uri
          nullable: true
          description: "Avatar image URL, must be a valid URL (https://...)"
          example: "https://example.com/avatar.png"
        preferred_language:
          type: string
          nullable: true
          enum: [zh-TW, zh-CN, en, ja]
          description: "Preferred language, allowed values: zh-TW / zh-CN / en / ja"
          example: "zh-TW"
      # Note: required is intentionally omitted; all fields are optional

    # Standard response format
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Profile'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: "Error message"
          example: "missing authorization header"

    # Taipei Travel Attractions compatibility response
    AttractionsResponse:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          example: 471
        data:
          type: array
          items:
            $ref: '#/components/schemas/Attraction'

    Attraction:
      type: object
      required:
        - id
        - name
        - name_zh
        - open_status
        - introduction
        - open_time
        - zipcode
        - distric
        - address
        - tel
        - fax
        - email
        - months
        - nlat
        - elong
        - official_site
        - facebook
        - ticket
        - remind
        - staytime
        - modified
        - url
        - category
        - target
        - service
        - friendly
        - images
        - files
        - links
      properties:
        id:
          type: integer
          example: 257
        name:
          type: string
          example: "國立臺灣博物館_古生物館"
        name_zh:
          type: string
          nullable: true
          example: null
        open_status:
          type: integer
          example: 1
        introduction:
          type: string
        open_time:
          type: string
        zipcode:
          type: string
          example: "100"
        distric:
          type: string
          description: >
            Upstream field name is intentionally kept as "distric"
            for compatibility with the Taipei Travel API.
          example: "中正區"
        address:
          type: string
          example: "100 臺北市中正區襄陽路25號"
        tel:
          type: string
          example: "+886-2-23142699"
        fax:
          type: string
        email:
          type: string
        months:
          type: string
          example: "01,07,02,08,03,09,04,10,05,11,06,12"
        nlat:
          type: number
          format: double
          example: 25.04356
        elong:
          type: number
          format: double
          example: 121.51436
        official_site:
          type: string
        facebook:
          type: string
        ticket:
          type: string
        remind:
          type: string
        staytime:
          type: string
        modified:
          type: string
          example: "2026-08-21 11:45:57 +08:00"
        url:
          type: string
        category:
          type: array
          items:
            $ref: '#/components/schemas/AttractionTag'
        target:
          type: array
          items:
            $ref: '#/components/schemas/AttractionTag'
        service:
          type: array
          items: {}
        friendly:
          type: array
          items:
            $ref: '#/components/schemas/AttractionTag'
        images:
          type: array
          items:
            $ref: '#/components/schemas/AttractionImage'
        files:
          type: array
          items: {}
        links:
          type: array
          items:
            $ref: '#/components/schemas/AttractionLink'

    AttractionTag:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 13
        name:
          type: string
          example: "歷史建築"

    AttractionImage:
      type: object
      required:
        - src
        - subject
        - ext
      properties:
        src:
          type: string
          example: "https://www.travel.taipei/image/65317"
        subject:
          type: string
          example: ""
        ext:
          type: string
          example: ".jpg"

    AttractionLink:
      type: object
      required:
        - src
        - subject
      properties:
        src:
          type: string
        subject:
          type: string

    AttractionsErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "upstream service unavailable"

    # Taipei Travel Events compatibility responses
    NewsResponse:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          example: 35
        data:
          type: array
          items:
            $ref: '#/components/schemas/News'

    News:
      type: object
      required:
        - id
        - title
        - description
        - begin
        - end
        - posted
        - modified
        - url
        - files
        - links
      properties:
        id:
          type: integer
          example: 45417
        title:
          type: string
          example: "水門何時關？北市府設多管道　民眾防汛資訊不漏接"
        description:
          type: string
        begin:
          type: string
          nullable: true
          example: null
        end:
          type: string
          nullable: true
          example: null
        posted:
          type: string
          example: "2023-04-04 09:06:00 +08:00"
        modified:
          type: string
          example: "2023-04-10 10:21:08 +08:00"
        url:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/EventFile'
        links:
          type: array
          items:
            $ref: '#/components/schemas/EventLink'

    ActivityResponse:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          example: 24
        data:
          type: array
          items:
            $ref: '#/components/schemas/Activity'

    Activity:
      type: object
      required:
        - distric
        - address
        - nlat
        - elong
        - organizer
        - co_rganizer
        - contact
        - tel
        - fax
        - ticket
        - traffic
        - parking
        - id
        - title
        - description
        - begin
        - end
        - posted
        - modified
        - url
        - files
        - links
      properties:
        distric:
          type: string
          example: ""
        address:
          type: string
          example: ""
        nlat:
          type: string
          description: >
            Unlike Attractions, the upstream Events/Activity API returns
            this coordinate as a string rather than a number.
          example: "25.0346"
        elong:
          type: string
          example: "121.522"
        organizer:
          type: string
          example: "吳偉谷"
        co_rganizer:
          type: string
          description: >
            Upstream field name is intentionally kept as "co_rganizer"
            for compatibility with the Taipei Travel API.
          example: ""
        contact:
          type: string
        tel:
          type: string
        fax:
          type: string
        ticket:
          type: string
        traffic:
          type: string
        parking:
          type: string
        id:
          type: integer
          example: 67755
        title:
          type: string
          example: "存在的輕聲 ─ 對話 吳偉谷陶塑個展"
        description:
          type: string
        begin:
          type: string
          nullable: true
          example: "2026-08-19 00:00:00 +08:00"
        end:
          type: string
          nullable: true
          example: "2026-08-30 23:59:59 +08:00"
        posted:
          type: string
        modified:
          type: string
        url:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/EventFile'
        links:
          type: array
          items:
            $ref: '#/components/schemas/EventLink'

    CalendarResponse:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          example: 23
        data:
          type: array
          items:
            $ref: '#/components/schemas/Calendar'

    Calendar:
      type: object
      required:
        - distric
        - address
        - nlat
        - elong
        - tel
        - fax
        - ticket
        - traffic
        - parking
        - is_major
        - id
        - title
        - description
        - begin
        - end
        - posted
        - modified
        - url
        - files
        - links
      properties:
        distric:
          type: string
          example: ""
        address:
          type: string
          example: ""
        nlat:
          type: string
          example: "25.0886"
        elong:
          type: string
          example: "121.524"
        tel:
          type: string
        fax:
          type: string
        ticket:
          type: string
        traffic:
          type: string
        parking:
          type: string
        is_major:
          type: boolean
          example: false
        id:
          type: integer
          example: 66376
        title:
          type: string
          example: "2026臺北夜市打牙祭"
        description:
          type: string
        begin:
          type: string
          nullable: true
          example: "2026-05-14 00:00:00 +08:00"
        end:
          type: string
          nullable: true
          example: "2026-10-31 23:59:59 +08:00"
        posted:
          type: string
        modified:
          type: string
        url:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/EventFile'
        links:
          type: array
          items:
            $ref: '#/components/schemas/EventLink'

    EventFile:
      type: object
      properties:
        src:
          type: string
        subject:
          type: string
        ext:
          type: string

    EventLink:
      type: object
      properties:
        src:
          type: string
        subject:
          type: string

    EventsErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "upstream service unavailable"

    # Taipei Travel Media compatibility response
    AudioResponse:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          example: 140
        data:
          type: array
          items:
            $ref: '#/components/schemas/Audio'

    Audio:
      type: object
      required:
        - id
        - title
        - summary
        - url
        - file_ext
        - modified
      properties:
        id:
          type: integer
          example: 28
        title:
          type: string
          example: "北投圖書館"
        summary:
          type: string
          nullable: true
          example: null
        url:
          type: string
          example: "https://www.travel.taipei/audio/28"
        file_ext:
          type: string
          nullable: true
          example: null
        modified:
          type: string
          example: "2025-12-10 15:55:41 +08:00"

    MediaErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "unsupported language: xx"

    # Taipei Travel Tours compatibility response
    ThemeResponse:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          example: 87
        data:
          type: array
          items:
            $ref: '#/components/schemas/Theme'

    Theme:
      type: object
      required:
        - id
        - seasons
        - months
        - days
        - title
        - author
        - description
        - consume
        - remark
        - note
        - url
        - category
        - transport
        - users
        - modified
        - files
      properties:
        id:
          type: integer
          example: 1409
        seasons:
          type: array
          items:
            type: string
          example: ["1", "2", "3", "4"]
        months:
          type: array
          items:
            type: string
          example: ["01", "02", "03"]
        days:
          type: integer
          example: 1
        title:
          type: string
          example: "鐵道觀光主題遊程"
        author:
          type: string
        description:
          type: string
        consume:
          type: string
        remark:
          type: string
        note:
          type: string
        url:
          type: string
        category:
          nullable: true
          description: >
            The upstream sample data always returns null for this field, and
            its non-null schema is undocumented. Passed through as-is.
        transport:
          nullable: true
          description: Same as `category` — always null in observed samples.
        users:
          nullable: true
          description: Same as `category` — always null in observed samples.
        modified:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/TourFile'

    TourFile:
      type: object
      properties:
        src:
          type: string
        subject:
          type: string
        ext:
          type: string

    ToursErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "unsupported language: xx"

    # Taipei Travel Miscellaneous compatibility response
    CategoriesResponse:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          example: 20
        data:
          $ref: '#/components/schemas/CategoriesData'

    CategoriesData:
      type: object
      description: >
        Confirmed for type=Tours only. The wrapper key is "Category"
        (singular, capitalized). Other "type" values have not yet been
        verified to use the same key.
      required:
        - Category
      properties:
        Category:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 532
        name:
          type: string
          example: "樂遊臺北"

    MiscellaneousErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "invalid parameter: type (Foo)"

paths:
  # Health check
  /healthz:
    get:
      tags: [System]
      summary: Health check
      description: Verify that the server is running normally. No token required.
      security: []    # Override global security; this endpoint does not require authentication
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "ok"
              example:
                success: true
                data:
                  status: "ok"

  # /api/v1/me
  /api/v1/me:
    get:
      tags: [Me]
      summary: Get the profile of the currently logged-in user
      description: |
        Retrieve the user_id from the JWT token and query the corresponding profile.

        ### Special Notes
        - **The profile will be automatically created if it does not exist.** The frontend does not need to call the profile creation API separately.
        - For first login, simply call this API.

        ### Required Headers
        ```
        Authorization: Bearer <supabase_access_token>
        ```

        ### Backend Flow
        1. Retrieve the Bearer token from the `Authorization` header.
        2. Verify the Supabase JWT (HS256).
        3. Retrieve the `user_id` from `claims.sub`.
        4. Query the `profiles` table.
        5. If it does not exist, it will be automatically created. `preferred_language` is preset to `zh-TW`.
        6. Return the profile.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successfully obtained (or automatically created) profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                existing_profile:
                  summary: A profile already exists.
                  value:
                    success: true
                    data:
                      id: "0e9b1a0e-1234-5678-abcd-xxxxxxxxxxxx"
                      email: "user@example.com"
                      display_name: "Sun"
                      avatar_url: "https://example.com/avatar.png"
                      preferred_language: "zh-TW"
                      created_at: "2026-06-14T00:00:00Z"
                      updated_at: "2026-06-14T00:10:00Z"
                new_profile:
                  summary: The profile is automatically created upon first login.
                  value:
                    success: true
                    data:
                      id: "0e9b1a0e-1234-5678-abcd-xxxxxxxxxxxx"
                      email: "user@example.com"
                      display_name: null
                      avatar_url: null
                      preferred_language: "zh-TW"
                      created_at: "2026-06-14T00:00:00Z"
                      updated_at: "2026-06-14T00:00:00Z"
        "401":
          description: |
            Unauthorized, possible reasons:
            - No `Authorization` header
            - Incorrect format (not `Bearer <token>`)
            - Token expired
            - Incorrect token signature (incorrect JWT Secret)
            - Token's `role` is not `authenticated`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_header:
                  summary: No Authorization header included
                  value:
                    success: false
                    error: "missing authorization header"
                invalid_token:
                  summary: The token is invalid or has expired.
                  value:
                    success: false
                    error: "invalid or expired token"
        "500":
          description: Server internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "failed to get profile"

    put:
      tags: [Me]
      summary: Update the current logged-in user's profile
      description: |
        Update the profile data of the currently logged-in user.

        ### Important Rules
        - **All fields are optional**; only send the fields you want to update, and omitted fields keep their original values
        - **Do not send `user_id`**; the backend automatically gets it from JWT `claims.sub`
        - Call `GET /api/v1/me` first to ensure the profile exists before updating

        ### Update Name Only (Leave Other Fields Unchanged)
        ```json
        { "display_name": "Sun" }
        ```

        ### Update Language Only (Leave Other Fields Unchanged)
        ```json
        { "preferred_language": "en" }
        ```

        ### Update All Fields
        ```json
        {
          "display_name": "Sun",
          "avatar_url": "https://example.com/avatar.png",
          "preferred_language": "zh-TW"
        }
        ```

        ### Field Rules
        | Field | Rule |
        |------|------|
        | `display_name` | 1-50 characters; leading/trailing spaces are automatically trimmed |
        | `avatar_url` | Must be a valid URL (https://...) |
        | `preferred_language` | Allowed values only: `zh-TW` `zh-CN` `en` `ja` |
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            examples:
              name_only:
                summary: Update name only
                value:
                  display_name: "Sun"
              language_only:
                summary: Update language only
                value:
                  preferred_language: "en"
              update_all:
                summary: Update all fields
                value:
                  display_name: "Sun"
                  avatar_url: "https://example.com/avatar.png"
                  preferred_language: "zh-TW"
      responses:
        "200":
          description: Update succeeded; returns the full updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  id: "0e9b1a0e-1234-5678-abcd-xxxxxxxxxxxx"
                  email: "user@example.com"
                  display_name: "Sun"
                  avatar_url: "https://example.com/avatar.png"
                  preferred_language: "zh-TW"
                  created_at: "2026-06-14T00:00:00Z"
                  updated_at: "2026-06-14T00:10:00Z"
        "400":
          description: Invalid request body format (not valid JSON)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "invalid JSON body"
        "401":
          description: Unauthorized (token is invalid or expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "missing authorization header"
        "403":
          description: Token role is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "token role is not authenticated"
        "404":
          description: |
            Profile does not exist.
            Please call `GET /api/v1/me` first to create the profile, then update it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "profile not found, call GET /api/v1/me first"
        "422":
          description: |
            Field validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_name:
                  summary: Invalid name length
                  value:
                    success: false
                    error: "display_name: must be 1–50 characters"
                invalid_url:
                  summary: Invalid URL format
                  value:
                    success: false
                    error: "avatar_url: must be a valid URL (https://...)"
                invalid_language:
                  summary: Language is not in the allowed list
                  value:
                    success: false
                    error: "preferred_language: must be one of: zh-TW, zh-CN, en, ja"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "failed to update profile"

  # Taipei Travel attractions proxy
  /open-api/{lang}/Attractions/All:
    get:
      tags:
        - Attractions
      summary: List attractions
      description: |
        Compatibility proxy for the Taipei Travel open API.

        No authentication is required because this endpoint serves
        public tourism data.

        The endpoint, query parameters, JSON field names, field types,
        and response structure are kept compatible with the upstream API.

        The Go backend internally uses its own DTO and mapper layer,
        while preserving the contract expected by existing clients.
      security: []
      parameters:
        - name: lang
          in: path
          required: true
          description: Response language
          schema:
            type: string
            enum:
              - zh-tw
              - zh-cn
              - en
              - ja
              - ko
          example: zh-tw
        - name: categoryIds
          in: query
          required: false
          description: >
            Comma-separated attraction category IDs.
            Example: 13,15
          schema:
            type: string
          example: "13"
        - name: nlat
          in: query
          required: false
          description: Latitude in WGS84 for nearby attraction queries
          schema:
            type: number
            format: double
          example: 25.04356
        - name: elong
          in: query
          required: false
          description: Longitude in WGS84 for nearby attraction queries
          schema:
            type: number
            format: double
          example: 121.51436
        - name: page
          in: query
          required: false
          description: Page number; upstream returns up to 30 results per page
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
      responses:
        "200":
          description: Attractions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttractionsResponse'
        "400":
          description: Unsupported language
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttractionsErrorResponse'
              example:
                error: "unsupported language: xx"
        "502":
          description: Taipei Travel upstream API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttractionsErrorResponse'
              example:
                error: "upstream service unavailable"

