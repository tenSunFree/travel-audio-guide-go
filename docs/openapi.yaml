  # Taipei Travel miscellaneous proxy
  /open-api/{lang}/Miscellaneous/Categories:
    get:
      tags:
        - Miscellaneous
      summary: List categories for a given resource type
      description: |
        Compatibility proxy for the Taipei Travel Miscellaneous/Categories
        open API.

        No authentication is required. The "type" query parameter is
        required by the upstream API; this backend validates it before
        forwarding the request.
      security: []
      parameters:
        - name: lang
          in: path
          required: true
          description: Response language
          schema:
            type: string
            enum:
              - zh-tw
              - zh-cn
              - en
              - ja
              - ko
          example: zh-tw
        - name: type
          in: query
          required: true
          description: >
            Resource type to look up categories for. Currently only "Tours"
            is supported — its upstream response wrapper has been verified.
            Other upstream-documented values are not yet enabled pending
            verification of their response shape.
          schema:
            type: string
            enum:
              - Tours
          example: Tours
      responses:
        "200":
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
        "400":
          description: Unsupported language, or missing/invalid "type" parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiscellaneousErrorResponse'
              examples:
                missing_type:
                  summary: Missing "type" parameter
                  value:
                    error: "invalid parameter: type ()"
                invalid_type:
                  summary: Invalid "type" value
                  value:
                    error: "invalid parameter: type (Foo)"
        "502":
          description: Taipei Travel upstream API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiscellaneousErrorResponse'
              example:
                error: "upstream service unavailable"